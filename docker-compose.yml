x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    container_name: atl-redis
    image: redis:alpine
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 128mb
        --maxmemory-policy noeviction
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 192M
    networks: [app-net]
    logging: *default-logging

  redis-cache:
    container_name: atl-redis-cache
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --save ""
    deploy:
      resources:
        limits:
          memory: 160M
    networks: [app-net]
    logging: *default-logging

  mosquitto:
    container_name: atl-mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"
    volumes:
      - ./config/mosquitto:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    env_file:
      - ./environment/site.env
    networks: [app-net]
    logging: *default-logging

  site:
    container_name: atl-site
    build:
      context: .
      dockerfile: ./site/Dockerfile
    image: atl-site:latest
    init: true
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn autotimelapse.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120 --keep-alive 5 --access-logfile - --error-logfile -"
    volumes:
      - ./repo/backend:/app
      - static_data:/app/staticfiles
    working_dir: /app
    env_file:
      - ./environment/site.env
    environment:
      DJANGO_SETTINGS_MODULE: autotimelapse.settings
      REDIS_BROKER_URL: redis://redis:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
    networks: [app-net, seaweed-net]
    depends_on:
      - postgres
      - redis
      - redis-cache
      - mosquitto
      - seaweed-filer
    logging: *default-logging

  nginx:
    container_name: atl-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/conf.d/:/etc/nginx/conf.d/
      - ./config/nginx/ssl/:/etc/nginx/ssl/:ro
      - static_data:/static:ro
      - ./repo/frontend/dist:/frontend:ro
    networks: [app-net, seaweed-net]
    depends_on: [site, seaweed-filer]
    logging: *default-logging

  mqtt_service:
    container_name: atl-mqtt-service
    build:
      context: .
      dockerfile: ./mqtt_service/Dockerfile
    image: atl-mqtt-service:latest
    init: true
    restart: unless-stopped
    command: python manage.py mqtt_listen
    volumes:
      - ./repo/backend:/app
    working_dir: /app
    env_file:
      - ./environment/site.env
    environment:
      DJANGO_SETTINGS_MODULE: autotimelapse.settings
      REDIS_BROKER_URL: redis://redis:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
    networks: [app-net]
    depends_on: [postgres, redis, mosquitto]
    logging: *default-logging

  celery_worker:
    container_name: atl-celery-worker
    build:
      context: .
      dockerfile: ./site/Dockerfile
    image: atl-site:latest
    init: true
    restart: unless-stopped
    # Q default,archive: nén ZIP và các task nhẹ — concurrency=4 để xử lý song song
    command: celery -A autotimelapse worker -l info -Q default,archive -c 4
    volumes:
      - ./repo/backend:/app
      - ./data/postgres-backup:/backup:ro
    working_dir: /app
    env_file:
      - ./environment/site.env
    environment:
      DJANGO_SETTINGS_MODULE: autotimelapse.settings
      REDIS_BROKER_URL: redis://redis:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks: [app-net, seaweed-net]
    depends_on: [postgres, redis, site]
    logging: *default-logging

  celery_render:
    container_name: atl-celery-render
    build:
      context: .
      dockerfile: ./site/Dockerfile
    image: atl-site:latest
    init: true
    restart: unless-stopped
    # Q render: chỉ dành cho ffmpeg encode — concurrency=1 để không ngốn hết CPU
    # max-tasks-per-child=2: giải phóng bộ nhớ sau mỗi 2 render job
    command: celery -A autotimelapse worker -l info -Q render -c 1 --max-tasks-per-child=2
    volumes:
      - ./repo/backend:/app
    working_dir: /app
    env_file:
      - ./environment/site.env
    environment:
      DJANGO_SETTINGS_MODULE: autotimelapse.settings
      REDIS_BROKER_URL: redis://redis:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2560M
    networks: [app-net, seaweed-net]
    depends_on: [postgres, redis, site]
    logging: *default-logging

  celery_beat:
    container_name: atl-celery-beat
    build:
      context: .
      dockerfile: ./site/Dockerfile
    image: atl-site:latest
    init: true
    restart: unless-stopped
    command: celery -A autotimelapse beat -l info --schedule /var/run/celery/celerybeat-schedule
    volumes:
      - ./repo/backend:/app
    working_dir: /app
    env_file:
      - ./environment/site.env
    environment:
      DJANGO_SETTINGS_MODULE: autotimelapse.settings
      REDIS_BROKER_URL: redis://redis:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
    tmpfs:
      - /var/run/celery
    networks: [app-net]
    depends_on: [postgres, redis, site]
    logging: *default-logging

  # ----------------------------------------------------------------
  # TANG 1: Control plane - quan ly topology cua cluster
  # ----------------------------------------------------------------
  seaweed-master:
    image: chrislusf/seaweedfs:4.40
    container_name: seaweed-master
    command: >
      master
        -ip=seaweed-master
        -ip.bind=0.0.0.0
        -mdir=/data
        -defaultReplication=000
        -volumeSizeLimitMB=1024
        -metricsPort=9324
    ports:
      - "127.0.0.1:9333:9333"    # HTTP API + UI (Nội bộ / Localhost)
      - "127.0.0.1:19333:19333"  # gRPC (Nội bộ / Localhost)
      - "127.0.0.1:9324:9324"    # Prometheus metrics (Nội bộ / Localhost)
    volumes:
      - ./data/seaweed/master:/data
    networks:
      - seaweed-net
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ----------------------------------------------------------------
  # TANG 2: Storage plane - noi luu file thuc te (anh, video)
  # ----------------------------------------------------------------
  seaweed-volume:
    image: chrislusf/seaweedfs:4.40
    container_name: seaweed-volume
    command: >
      volume
        -mserver=seaweed-master:9333
        -ip=seaweed-volume
        -ip.bind=0.0.0.0
        -port=8080
        -dir=/data
        -max=20
        -metricsPort=9325
    ports:
      - "127.0.0.1:8080:8080"    # HTTP API (Nội bộ / Localhost)
      - "127.0.0.1:18080:18080"  # gRPC (Nội bộ / Localhost)
      - "127.0.0.1:9325:9325"    # Prometheus metrics (Nội bộ / Localhost)
    volumes:
      - ./data/seaweed/volume:/data
    networks:
      - seaweed-net
    depends_on: [seaweed-master]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  # ----------------------------------------------------------------
  # TANG 3: Access plane - filesystem view + S3 gateway
  # ----------------------------------------------------------------
  seaweed-filer:
    image: chrislusf/seaweedfs:4.40
    container_name: seaweed-filer
    command: >
      filer
        -master=seaweed-master:9333
        -ip=seaweed-filer
        -ip.bind=0.0.0.0
        -metricsPort=9326
        -s3
        -s3.port=8333
        -s3.config=/config/s3.json
    ports:
      - "127.0.0.1:8888:8888"    # Filer HTTP (Chặn bypass upload ngoài)
      - "127.0.0.1:18888:18888"  # Filer gRPC (Nội bộ / Localhost)
      - "8333:8333"              # S3 gateway PUBLIC (ĐÃ BẢO VỆ BẰNG S3 AUTH & PRESIGNED URL)
      - "127.0.0.1:9326:9326"    # Prometheus metrics (Nội bộ / Localhost)
    tty: true
    stdin_open: true
    volumes:
      - ./data/seaweed/filer:/data
      - ./config/seaweed:/config:ro
    networks:
      - seaweed-net
    depends_on: [seaweed-master, seaweed-volume]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  # ----------------------------------------------------------------
  # DB plane - metadata store
  # ----------------------------------------------------------------
  postgres:
    container_name: atl-postgres
    image: postgres:16-alpine
    env_file:
      - ./environment/site.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - seaweed-net
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atl_user -d autotimelapse"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # pg_dump hàng ngày 01:00, giữ 7 bản gần nhất
  postgres-backup:
    container_name: atl-postgres-backup
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./environment/site.env
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./data/postgres-backup:/backup
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        last_backup_day=""
        while true; do
          current_day="$$(date +%Y%m%d)"
          if [ "$$(date +%H)" = "01" ] && [ "$$last_backup_day" != "$$current_day" ]; then
            PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -Fc \
              -f /backup/atl_$$(date +%Y%m%d_%H%M).dump \
              && ls -t /backup/*.dump 2>/dev/null | tail -n +8 | xargs -r rm -f
            last_backup_day="$$current_day"
          fi
          sleep 300
        done
    logging: *default-logging

volumes:
  static_data:
  redis_data:

networks:
  app-net:
    driver: bridge
  seaweed-net:
    driver: bridge

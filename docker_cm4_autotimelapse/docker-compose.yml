services:
  cm4-camera-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: pcthuoc/cm4_autotimelapse:latest
    container_name: cm4_camera_agent
    restart: unless-stopped
    privileged: true
    network_mode: "host"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/mem:/dev/mem"
      - "/dev/i2c-1:/dev/i2c-1"
    volumes:
      - ./src:/app/src
      - ${DATA_DIR:-./data}/offline_queue:/app/offline_queue
      - /dev:/dev
      - /sys:/sys
      - /run/udev:/run/udev:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    env_file:
      - .env
    environment:
      - CAMERA_CODE=${CAMERA_CODE:?CAMERA_CODE must be set in .env}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?MQTT_PASSWORD must be set in .env}
      - MQTT_BROKER=${MQTT_BROKER:-cloud.congnghetimelapse.com}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - SERVER_BASE=${SERVER_BASE:-https://cloud.congnghetimelapse.com}
      - POWER_GPIO_PIN=${POWER_GPIO_PIN:-16}
      - POWER_ACTIVE_HIGH=${POWER_ACTIVE_HIGH:-true}
      - WARMUP_DELAY_SEC=${WARMUP_DELAY_SEC:-3.0}
      - ALWAYS_KEEP_POWER=${ALWAYS_KEEP_POWER:-false}
      - AUTO_SHUTDOWN_AFTER_CAPTURE=${AUTO_SHUTDOWN_AFTER_CAPTURE:-false}
      - AUTO_CAPTURE_ON_BOOT=${AUTO_CAPTURE_ON_BOOT:-false}
      - SHUTDOWN_DELAY_SEC=${SHUTDOWN_DELAY_SEC:-3.0}
      - TELEMETRY_INTERVAL=${TELEMETRY_INTERVAL:-30}
      - I2C_BUS_ID=${I2C_BUS_ID:-1}
      - EMC2301_I2C_ADDR=${EMC2301_I2C_ADDR:-0x2F}
      - ADS1115_I2C_ADDR=${ADS1115_I2C_ADDR:-0x49}
      - ADS1115_5V_CHANNEL=${ADS1115_5V_CHANNEL:-1}
      - ADS1115_SOLAR_CHANNEL=${ADS1115_SOLAR_CHANNEL:-2}
      - ADS1115_BATTERY_CHANNEL=${ADS1115_BATTERY_CHANNEL:-3}
      - BATTERY_VOLTAGE_SCALE=${BATTERY_VOLTAGE_SCALE:-5.545}
      - SOLAR_VOLTAGE_SCALE=${SOLAR_VOLTAGE_SCALE:-5.545}
      - CH2_VOLTAGE_SCALE=${CH2_VOLTAGE_SCALE:-3.0}
      - SOLAR_FAN_GPIO_PIN=${SOLAR_FAN_GPIO_PIN:-19}
      - FAN_TEMP_OFF=${FAN_TEMP_OFF:-15.0}
      - FAN_TEMP_MID=${FAN_TEMP_MID:-25.0}
      - FAN_TEMP_HIGH=${FAN_TEMP_HIGH:-35.0}
      - OFFLINE_QUEUE_DIR=${OFFLINE_QUEUE_DIR:-/app/offline_queue}
      - OFFLINE_RETRY_INTERVAL=${OFFLINE_RETRY_INTERVAL:-60}


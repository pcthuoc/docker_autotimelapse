# ======================
# Mosquitto MQTT Broker
# ======================

# Listener MQTT TCP
listener 1883
protocol mqtt

# Listener WebSocket
listener 8083
protocol websockets

# Tắt anonymous - chỉ cho phép kết nối có username/password
allow_anonymous false

# Dynamic Security Plugin (v2.1+)
# File dynamic-security.json sẽ được tự động tạo nếu chưa tồn tại
# User "admin" với password từ biến MOSQUITTO_DYNSEC_PASSWORD
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true

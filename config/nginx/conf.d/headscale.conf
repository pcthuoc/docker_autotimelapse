# Headscale Control Plane & Web UI for mesh.congnghetimelapse.com

upstream headscale_backend {
    server headscale:8085;
}

upstream headscale_ui_backend {
    server headscale_ui:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name mesh.congnghetimelapse.com;

    # Headscale Web UI
    location /web {
        proxy_pass http://headscale_ui_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Headscale Control Plane (HTTP Direct - Không cần SSL/Chứng chỉ)
    location / {
        proxy_pass http://headscale_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mesh.congnghetimelapse.com;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Headscale Web UI (Giao diện đồ họa quản trị)
    location /web {
        proxy_pass http://headscale_ui_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Headscale Control Plane (Tailscale Client Protocol & API)
    location / {
        proxy_pass http://headscale_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}
